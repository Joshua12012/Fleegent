[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/edge-daemon",
    "crates/edge-supervisor",
    "crates/wasm-worker",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-nats = "0.35"
rusqlite = { version = "0.31", features = ["bundled"] }
tonic = "0.12"
prost = "0.13"
jsonwebtoken = "9"
sha2 = "0.10"
sysinfo = "0.30"
wasmtime = "21"
wasmtime-wasi = "21"
wit-bindgen = "0.30"

[workspace.dependencies.edge-shared]
path = "crates/shared"
