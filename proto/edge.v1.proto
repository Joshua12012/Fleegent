syntax = "proto3";

package edge.v1;

option go_package = "edge.v1";

service EdgeControlPlane {
  rpc AuthenticateDevice(AuthRequest) returns (AuthResponse);
  rpc StreamTelemetry(stream TelemetryPacket) returns (Ack);
  rpc GetDeploymentPackage(PackageRequest) returns (stream FileChunk);
}

message AuthRequest {
  string device_serial = 1;
  string secret = 2;
}

message AuthResponse {
  string jwt = 1;
  int64 expires_at_unix = 2;
}

message TelemetryPacket {
  string device_id = 1;
  double cpu_pct = 2;
  int32 mem_used_mb = 3;
  int32 mem_total_mb = 4;
  int64 uptime_s = 5;
  string ts = 6;
}

message Ack {
  bool ok = 1;
  string error = 2;
}

message PackageRequest {
  string device_id = 1;
  string model_path = 2;
}

message FileChunk {
  bytes data = 1;
  string sha256 = 2;
  string version = 3;
  bool is_last = 4;
}
